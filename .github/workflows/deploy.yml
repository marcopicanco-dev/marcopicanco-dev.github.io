name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # workflow_dispatch permite escolher outra branch; ela não pode publicar.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Setup npm
        run: npm install --global npm@12.2.0

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Security checks
        run: npm run security

      - name: Build Astro
        run: npm run build

      # Bloqueia o deploy se o header CSP da Cloudflare ainda não permitir os
      # hashes deste build; o resumo do job traz o valor para colar na Cloudflare.
      - name: Check Cloudflare CSP header covers this build
        run: npm run security:edge-csp

      - name: Upload artifact
        # Atualizado para v5 (resolve a dependência interna do upload-artifact@v4)
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist
          # A v5 ignora pastas ocultas por padrão; sem isso /.well-known/security.txt não é publicado.
          include-hidden-files: true

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        # Atualizado para v5 (suporte oficial e nativo ao Node 24)
        uses: actions/deploy-pages@v5

  production-security:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Setup npm
        run: npm install --global npm@12.2.0

      - name: Install dependencies
        run: npm ci

      - name: External scanner links
        run: |
          {
            echo "### External security header scanners"
            echo ""
            echo "- SecurityHeaders.com: https://securityheaders.com/?q=www.marcopicanco.com&hide=on&followRedirects=on"
            echo "- MDN HTTP Observatory: https://developer.mozilla.org/en-US/observatory/analyze?host=www.marcopicanco.com"
            echo ""
            echo "SecurityHeaders.com may challenge automated CI requests, so this workflow keeps the browser scan link as manual evidence and enforces the same core headers with npm run security:headers."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate production security headers
        env:
          SITE_URL: https://www.marcopicanco.com
        run: |
          for attempt in 1 2 3 4 5; do
            if npm run security:headers; then
              exit 0
            fi

            echo "Production headers are not ready yet; retrying in 60 seconds..."
            sleep 60
          done

          npm run security:headers
