name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        # Atualizado para @v6 (Roda nativamente em Node 24)
        uses: actions/checkout@v6

      - name: Setup Node.js
        # Atualizado para @v5 (Roda nativamente em Node 24)
        uses: actions/setup-node@v5
        with:
          node-version: '22' # Mantido o Node 22 estável para compilar o seu projeto
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Astro
        run: npm run build

      - name: Upload artifact
        # Atualizado para @v4 (Ajustado internamente para Node 24)
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        # Atualizado para @v4 finalizada ou @v5 dependendo do ecossistema do Pages
        uses: actions/deploy-pages@v4