name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        # Atualizado para v4.2.2 (Evita o aviso de Node 20)
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        # Atualizado para v4.2.0 (Evita o aviso de Node 20)
        uses: actions/setup-node@v4.2.0
        with:
          node-version: '22' # Atualizado para a versão LTS estável
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Astro
        run: npm run build

      - name: Upload artifact
        # Atualizado para v3.0.1 (A versão estável atualizada para Node 24)
        # Nota: O upload-pages-artifact oficial está na v3, a v4 que gerou o alerta era outro hash.
        uses: actions/upload-pages-artifact@v3.0.1
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        # Atualizado para v4.0.5 (Evita o aviso de Node 20)
        uses: actions/deploy-pages@v4.0.5