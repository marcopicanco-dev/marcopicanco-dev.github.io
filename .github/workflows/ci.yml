name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Setup npm
        run: npm install --global npm@12.2.0

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Security checks
        run: npm run security

      - name: Build
        run: npm run build

      - name: Check Cloudflare CSP header covers this build
        run: npm run security:edge-csp
