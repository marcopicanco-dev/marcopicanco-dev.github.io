<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc">
  <title id="title">Print resumido da migração de dependências</title>
  <desc id="desc">Quadro em estilo terminal mostrando o npm audit saindo de 28 vulnerabilidades para zero vulnerabilidades após a migração para Astro 7.</desc>
  <rect width="1100" height="560" fill="#282a36"/>
  <rect x="36" y="34" width="1028" height="492" rx="16" fill="#11121a" stroke="#6272a4" stroke-opacity="0.45"/>
  <circle cx="70" cy="68" r="7" fill="#ff5555"/>
  <circle cx="94" cy="68" r="7" fill="#f1fa8c"/>
  <circle cx="118" cy="68" r="7" fill="#50fa7b"/>
  <text x="550" y="74" text-anchor="middle" fill="#b7b3ff" font-family="Karla, Arial, sans-serif" font-size="16">security-audit-migration.log</text>

  <text x="70" y="128" fill="#f8f8f2" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="22">$ npm audit --audit-level=moderate</text>
  <text x="70" y="168" fill="#ff79c6" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="22">28 vulnerabilities</text>
  <text x="70" y="202" fill="#ffb86c" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18">Astro, esbuild, rollup, sharp, postcss, prismjs...</text>

  <path d="M96 250H990" stroke="#6272a4" stroke-opacity="0.55" stroke-width="2" stroke-dasharray="10 10"/>
  <text x="70" y="300" fill="#f8f8f2" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="22">$ npm audit fix --force</text>
  <text x="70" y="340" fill="#f1fa8c" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18">major upgrade: astro 4 -> 7.1.3</text>
  <text x="70" y="374" fill="#8be9fd" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18">corrigir APIs removidas + alinhar integrações</text>

  <path d="M96 422H990" stroke="#6272a4" stroke-opacity="0.55" stroke-width="2" stroke-dasharray="10 10"/>
  <text x="70" y="470" fill="#f8f8f2" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="22">$ npm run security</text>
  <text x="70" y="506" fill="#50fa7b" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="22">found 0 vulnerabilities</text>

  <g transform="translate(748 128)">
    <rect width="248" height="250" rx="14" fill="#21222c" stroke="#8be9fd" stroke-opacity="0.35"/>
    <text x="24" y="48" fill="#8be9fd" font-family="Karla, Arial, sans-serif" font-size="18" font-weight="700">Depois</text>
    <text x="24" y="90" fill="#f8f8f2" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="17">astro@7.1.3</text>
    <text x="24" y="122" fill="#f8f8f2" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="17">vite@8.1.5</text>
    <text x="24" y="154" fill="#f8f8f2" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="17">esbuild@0.28.1</text>
    <text x="24" y="206" fill="#50fa7b" font-family="Karla, Arial, sans-serif" font-size="20" font-weight="700">audit limpo</text>
  </g>
</svg>
