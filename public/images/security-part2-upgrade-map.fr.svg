<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc">
  <title id="title">Carte de la migration vers Astro 7</title>
  <desc id="desc">Flux montrant les vulnérabilités, la mise à jour majeure d’Astro, les changements de code obligatoires et la validation avec lint, security et build.</desc>
  <rect width="1100" height="520" fill="#f8f8ff"/>
  <text x="70" y="72" fill="#24243d" font-family="Karla, Arial, sans-serif" font-size="32" font-weight="700">Une migration sûre, c’est plus qu’une mise à jour</text>
  <text x="70" y="106" fill="#595b85" font-family="Karla, Arial, sans-serif" font-size="18">Chaque étape doit finir avec build et tests au vert.</text>

  <g fill="#ffffff" stroke="#6272a4" stroke-opacity="0.28">
    <rect x="70" y="160" width="210" height="170" rx="12"/>
    <rect x="330" y="160" width="210" height="170" rx="12"/>
    <rect x="590" y="160" width="210" height="170" rx="12"/>
    <rect x="850" y="160" width="210" height="170" rx="12"/>
  </g>

  <g font-family="Karla, Arial, sans-serif">
    <text x="96" y="204" fill="#c43182" font-size="18" font-weight="700">1. Diagnostic</text>
    <text x="96" y="244" fill="#24243d" font-size="16">npm audit</text>
    <text x="96" y="274" fill="#595b85" font-size="15">identifie le paquet</text>
    <text x="96" y="300" fill="#595b85" font-size="15">et la chaîne touchée</text>

    <text x="356" y="204" fill="#7c5cff" font-size="18" font-weight="700">2. Mise à jour</text>
    <text x="356" y="244" fill="#24243d" font-size="16">Astro 7.1.3</text>
    <text x="356" y="274" fill="#595b85" font-size="15">intégrations</text>
    <text x="356" y="300" fill="#595b85" font-size="15">compatibles</text>

    <text x="616" y="204" fill="#007d95" font-size="18" font-weight="700">3. Code</text>
    <text x="616" y="244" fill="#24243d" font-size="16">ClientRouter</text>
    <text x="616" y="274" fill="#24243d" font-size="16">import.meta.glob</text>
    <text x="616" y="304" fill="#595b85" font-size="15">Tailwind via PostCSS</text>

    <text x="876" y="204" fill="#12844b" font-size="18" font-weight="700">4. Preuves</text>
    <text x="876" y="244" fill="#24243d" font-size="16">lint</text>
    <text x="876" y="274" fill="#24243d" font-size="16">security</text>
    <text x="876" y="304" fill="#24243d" font-size="16">build</text>
  </g>

  <g stroke="#bd93f9" stroke-width="3" stroke-linecap="round">
    <path d="M285 245h36"/>
    <path d="M545 245h36"/>
    <path d="M805 245h36"/>
  </g>
  <g fill="#bd93f9">
    <path d="M321 245l-12-8v16z"/>
    <path d="M581 245l-12-8v16z"/>
    <path d="M841 245l-12-8v16z"/>
  </g>

  <rect x="70" y="380" width="990" height="70" rx="12" fill="#282a36"/>
  <text x="96" y="424" fill="#f8f8f2" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="20">$ npm run lint &amp;&amp; npm run security &amp;&amp; npm run build</text>
  <text x="850" y="424" fill="#50fa7b" font-family="Karla, Arial, sans-serif" font-size="20" font-weight="700">au vert</text>
</svg>
