<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="'Karla', Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="460" rx="16" fill="#21222c" />

  <!-- Row 1: ANTES -->
  <text x="30" y="40" fill="#ff5555" font-size="20" font-weight="700">✕ ANTES — regra criada, mas fora do caminho</text>

  <!-- visitor -->
  <rect x="30" y="70" width="140" height="60" rx="10" fill="#282a36" stroke="#6272a4" stroke-width="1.5" />
  <text x="100" y="105" fill="#f8f8f2" font-size="16" text-anchor="middle">Visitante</text>

  <!-- arrow 1 -->
  <line x1="170" y1="100" x2="245" y2="100" stroke="#6272a4" stroke-width="2" marker-end="url(#arrow)" />

  <!-- DNS box -->
  <rect x="250" y="70" width="230" height="60" rx="10" fill="#282a36" stroke="#6272a4" stroke-width="1.5" />
  <text x="365" y="95" fill="#f8f8f2" font-size="14" text-anchor="middle">Nameservers</text>
  <text x="365" y="115" fill="#f8f8f2" font-size="14" text-anchor="middle">(registrador, não o Cloudflare)</text>

  <!-- arrow 2 -->
  <line x1="480" y1="100" x2="555" y2="100" stroke="#6272a4" stroke-width="2" marker-end="url(#arrow)" />

  <!-- origin box -->
  <rect x="560" y="70" width="310" height="60" rx="10" fill="#282a36" stroke="#ff5555" stroke-width="1.5" />
  <text x="715" y="95" fill="#f8f8f2" font-size="14" text-anchor="middle">GitHub Pages (Fastly)</text>
  <text x="715" y="115" fill="#ff5555" font-size="13" text-anchor="middle">sem X-Frame-Options / Permissions-Policy</text>

  <!-- disconnected cloudflare -->
  <rect x="365" y="160" width="230" height="55" rx="10" fill="#282a36" stroke="#6272a4" stroke-width="1.5" stroke-dasharray="6 5" opacity="0.65" />
  <text x="480" y="182" fill="#b7b3ff" font-size="14" text-anchor="middle">Cloudflare</text>
  <text x="480" y="200" fill="#b7b3ff" font-size="12" text-anchor="middle">regra pronta, tráfego não passa aqui</text>
  <line x1="480" y1="130" x2="480" y2="158" stroke="#6272a4" stroke-width="1.5" stroke-dasharray="4 4" />

  <!-- divider -->
  <line x1="30" y1="250" x2="870" y2="250" stroke="#44475a" stroke-width="1" />

  <!-- Row 2: DEPOIS -->
  <text x="30" y="290" fill="#50fa7b" font-size="20" font-weight="700">✓ DEPOIS — nameservers apontando pro Cloudflare</text>

  <rect x="30" y="320" width="140" height="60" rx="10" fill="#282a36" stroke="#6272a4" stroke-width="1.5" />
  <text x="100" y="355" fill="#f8f8f2" font-size="16" text-anchor="middle">Visitante</text>

  <line x1="170" y1="350" x2="245" y2="350" stroke="#50fa7b" stroke-width="2" marker-end="url(#arrowGreen)" />

  <rect x="250" y="320" width="280" height="60" rx="10" fill="#282a36" stroke="#50fa7b" stroke-width="1.5" />
  <text x="390" y="345" fill="#f8f8f2" font-size="14" text-anchor="middle">Cloudflare (edge)</text>
  <text x="390" y="365" fill="#50fa7b" font-size="12" text-anchor="middle">+ X-Frame-Options + Permissions-Policy + CORS</text>

  <line x1="530" y1="350" x2="605" y2="350" stroke="#50fa7b" stroke-width="2" marker-end="url(#arrowGreen)" />

  <rect x="610" y="320" width="260" height="60" rx="10" fill="#282a36" stroke="#6272a4" stroke-width="1.5" />
  <text x="740" y="355" fill="#f8f8f2" font-size="14" text-anchor="middle">GitHub Pages (origin)</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#6272a4" />
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#50fa7b" />
    </marker>
  </defs>
</svg>
